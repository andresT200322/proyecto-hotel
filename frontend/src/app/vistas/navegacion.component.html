@let isHandset = this.isHandset();

<mat-sidenav-container class="sidenav-container">
    <mat-sidenav #drawer class="sidenav" fixedInViewport [attr.role]="isHandset ? 'dialog' : 'navigation'" [mode]="isHandset ? 'over' : 'side'" [opened]="isHandset === false">
        <mat-toolbar>Menu</mat-toolbar>
        <mat-nav-list>
            <a mat-list-item href="">Inicio</a>
            <a mat-list-item href="/login">Login</a>
            <a mat-list-item href="/usuarios">Usuarios</a>
            <a mat-list-item href="/reservas">Reservas</a>
            <a mat-list-item href="/nosotros">Masdenosotros</a>
            <a mat-list-item href="/tabla">Tabla</a>
        </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>

        <mat-toolbar style="background-color: #1a3a6b; color: white;">
            @if (isHandset) {
            <button type="button" aria-label="Toggle sidenav" matIconButton (click)="drawer.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button> }
            <span>Cabañas El Paraiso De Apiay</span>
        </mat-toolbar>
        <router-outlet></router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>
