<div class="usuarios-container">
  <h1>Usuarios</h1>

  <div class="tabla-container">
    <table class="tabla">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Usuario</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of usuarios$ | async">
          <td>{{ u.id_usuario }}</td>
          <td>{{ u.nombre }}</td>
          <td>{{ u.email }}</td>
          <td>{{ u.telefono || '-' }}</td>
          <td>{{ u.username }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
